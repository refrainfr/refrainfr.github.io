<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Instructs search engines that this is the permanent new location (equivalent to 301) -->
    <link rel="canonical" href="https://orlandoferrari.github.io/">
    <!-- Automatically redirects the user after 0 seconds -->
    <meta http-equiv="refresh" content="0; url=https://orlandoferrari.github.io/">
    <title>Website Migrated</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        .message {
            max-width: 600px;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="message">
        <h2>This website is obsolete.</h2>
        <p>My homepage has permanently moved to <strong><a href="https://orlandoferrari.github.io/">orlandoferrari.github.io</a></strong>.</p>
        <p>If you are not redirected automatically, please click the link above.</p>
    </div>
</body>
</html>
